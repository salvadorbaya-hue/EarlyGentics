function openEditRegistroModal(tipo, contratoId, xId, regId){
  const c = getContract(contratoId);
  const esCobro = tipo==='cobro';
  const arr = esCobro ? c.cobros : c.entregas;
  const x = arr.find(y=>y.id===xId);
  const r = (x.registros||[]).find(rr=>rr.id===regId);
  if(!r) return;

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>Editar ${esCobro?'pago':'entrega'} — ${c.cliente}</h2><button class="btn btn-ghost" id="m-close">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Concepto</label><div style="font-weight:600">${esCobro? x.concepto : (x.variedad+' — entrega '+x.anio)}</div></div>
        <div class="field"><label>Fecha</label><input type="date" id="r-fecha" value="${r.fecha}"></div>
        <div class="field"><label>${esCobro?'Monto (USD)':'Cantidad de plantas'}</label><input type="text" inputmode="numeric" id="r-monto" value="${formatThousands(esCobro? r.monto : r.cantidad)}"></div>
        <div class="field"><label>Detalle (opcional)</label><input type="text" id="r-detalle" value="${r.detalle||''}"></div>
        <div class="field"><label>${esCobro?'Factura':'Remito'}</label>
          ${r.facturaKey? `<div class="hint">Adjunto: ${r.facturaNombre||'archivo'} — <a href="#" data-ver-factura="${r.facturaKey}">ver</a></div>` : ''}
          <input type="file" id="r-factura" accept=".pdf,.jpg,.jpeg,.png">
          <div class="hint">Subí un archivo para ${r.facturaKey?'reemplazar':'adjuntar'} ${esCobro?'la factura':'el remito'}.</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-danger" id="m-delete">Eliminar registro</button>
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary" id="m-save">Guardar cambios</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  attachAutoCap(document.getElementById('r-detalle'));
  attachThousandsFormat(document.getElementById('r-monto'));
  document.getElementById('m-close').onclick = ()=> overlay.remove();
  document.getElementById('m-cancel').onclick = ()=> overlay.remove();
  const verFacturaLink = overlay.querySelector('[data-ver-factura]');
  if(verFacturaLink) verFacturaLink.onclick = async (ev)=>{
    ev.preventDefault();
    const res = await storageGet(r.facturaKey);
    if(res && res.value){ const w = window.open(); w.document.write(`<iframe src="${res.value}" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>`); }
  };
  document.getElementById('m-delete').onclick = async ()=>{
    await borrarRegistroCascada(tipo, contratoId, xId, regId);
    overlay.remove();
  };
  document.getElementById('m-save').onclick = async ()=>{
    const fecha = document.getElementById('r-fecha').value;
    let val = parseThousands(document.getElementById('r-monto').value);
    const detalle = document.getElementById('r-detalle').value.trim();
    if(!val){ await showAlertModal('Ingresá un monto/cantidad mayor a 0.', 'error'); return; }
    const oldVal = esCobro ? r.monto : r.cantidad;
    const otherSum = (esCobro? sumRegistrosMonto(x) : sumRegistrosCantidad(x)) - oldVal;
    const totalX = esCobro ? x.monto : x.cantidad;
    const maxAllowed = totalX - otherSum;
    if(val > maxAllowed + 0.5){
      val = Math.max(0, maxAllowed);
      await showAlertModal(`El ${esCobro?'monto':'cantidad'} no puede superar lo pactado para este concepto. Se ajustó a ${esCobro?fmtUSD(val):fmtNum(val)}.`, 'warn');
    }
    r.fecha = fecha;
    r.detalle = detalle;
    if(esCobro) r.monto = val; else r.cantidad = val;
    const fileEl = document.getElementById('r-factura');
    if(fileEl && fileEl.files && fileEl.files[0]){
      const file = fileEl.files[0];
      try{
        const dataUrl = await new Promise((res,rej)=>{
          const reader = new FileReader();
          reader.onload = ()=> res(reader.result);
          reader.onerror = rej;
          reader.readAsDataURL(file);
        });
        const key = r.facturaKey || ((esCobro?'factura:':'remito:')+uid());
        await storageSet(key, dataUrl);
        r.facturaKey = key;
        r.facturaNombre = file.name;
      }catch(e){ console.error('No se pudo leer el archivo', e); }
    }
    overlay.remove();
    render();
    persist().then(render);
  };
}

function openRegistrarEntregaModal(contratoId, xId){
  const c = getContract(contratoId);
  const x = c.entregas.find(e=>e.id===xId);
  attachCarry(c);
  const registrado = sumRegistrosCantidad(x);
  const objetivo = x._efectivo;
  const pendiente = Math.max(0, objetivo - registrado);
  const anioSig = Number(x.anio) + 1;
  const nextItem = ()=> c.entregas.find(e=>e.variedad===x.variedad && Number(e.anio)===anioSig);
  const hayCompensacion = !!nextItem();

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>Registrar entrega — ${c.cliente}</h2><button class="btn btn-ghost" id="m-close">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label>Concepto</label>
          <div style="font-weight:600">${x.variedad} — entrega ${x.anio}</div>
          <div class="hint">Pactado: ${fmtNum(x.cantidad)}${objetivo!==x.cantidad?` · Ajustado por compensación a: ${fmtNum(objetivo)}`:''} · Ya registrado: ${fmtNum(registrado)} · Pendiente: ${fmtNum(pendiente)}</div>
        </div>
        <div class="field"><label>Fecha</label><input type="date" id="r-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Cantidad a registrar</label><input type="text" inputmode="numeric" id="r-monto" value="${formatThousands(pendiente)}"></div>
        <div id="r-warning"></div>
        <div class="field" id="r-tipo-wrap" style="display:none">
          <label>Tipo de entrega</label>
          <div class="month-toggle">
            <button type="button" class="btn btn-sm" id="btn-tipo-parcial" data-tipo="parcial">Parcial — sigo entregando después</button>
            <button type="button" class="btn btn-sm" id="btn-tipo-final" data-tipo="final" ${!hayCompensacion?'disabled title="No hay línea de '+x.variedad+' en '+anioSig+' para compensar"':''}>Entrega final — compensar el resto en ${anioSig}</button>
          </div>
          ${!hayCompensacion ? `<div class="hint">No existe una línea de ${x.variedad} en ${anioSig}, así que no se puede cerrar con faltante — solo podés registrar parcial.</div>` : ''}
        </div>
        <div class="field"><label>Detalle (opcional)</label><input type="text" id="r-detalle" placeholder="Ej: remito N°..."></div>
        <div class="field"><label>Adjuntar remito (opcional)</label><input type="file" id="r-factura" accept=".pdf,.jpg,.jpeg,.png"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary" id="m-save">Guardar registro</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  attachAutoCap(document.getElementById('r-detalle'));
  attachThousandsFormat(document.getElementById('r-monto'));

  let tipoEntrega = 'parcial';
  function updateTipoButtons(){
    document.getElementById('btn-tipo-parcial').className = 'btn btn-sm' + (tipoEntrega==='parcial' ? ' active' : '');
    document.getElementById('btn-tipo-final').className = 'btn btn-sm' + (tipoEntrega==='final' ? ' active' : '');
  }
  document.getElementById('btn-tipo-parcial').onclick = ()=>{ tipoEntrega='parcial'; updateTipoButtons(); };
  document.getElementById('btn-tipo-final').onclick = ()=>{ if(hayCompensacion){ tipoEntrega='final'; updateTipoButtons(); } };
  updateTipoButtons();

  function recompute(){
    const val = parseThousands(document.getElementById('r-monto').value);
    const warnEl = document.getElementById('r-warning');
    const tipoWrap = document.getElementById('r-tipo-wrap');
    if(val > pendiente){
      const excess = val - pendiente;
      warnEl.innerHTML = hayCompensacion
        ? `<div class="notice">⚠ Estás entregando ${fmtNum(excess)} de más sobre lo pactado. Se va a descontar automáticamente de ${x.variedad} en ${anioSig}.</div>`
        : `<div class="notice" style="border-color:var(--red); background:var(--red-dim); color:var(--red);">⚠ Estás entregando ${fmtNum(excess)} de más, pero no hay línea de ${x.variedad} en ${anioSig} para compensar. Vas a tener que ajustarlo manualmente.</div>`;
      tipoWrap.style.display = 'none';
    } else if(val < pendiente && val > 0){
      const shortfall = pendiente - val;
      warnEl.innerHTML = `<div class="notice">⚠ Estás entregando ${fmtNum(shortfall)} de menos sobre lo pendiente (${fmtNum(pendiente)}). Elegí si es una entrega parcial o si querés cerrarla y compensar el resto el año que viene.</div>`;
      tipoWrap.style.display = 'block';
    } else {
      warnEl.innerHTML = '';
      tipoWrap.style.display = 'none';
    }
  }
  document.getElementById('r-monto').addEventListener('input', recompute);
  recompute();

  document.getElementById('m-close').onclick = ()=> overlay.remove();
  document.getElementById('m-cancel').onclick = ()=> overlay.remove();
  document.getElementById('m-save').onclick = async ()=>{
    const fecha = document.getElementById('r-fecha').value;
    const val = parseThousands(document.getElementById('r-monto').value);
    const detalle = document.getElementById('r-detalle').value.trim();
    if(!val){ await showAlertModal('Ingresá una cantidad mayor a 0.', 'error'); return; }

    let facturaKey = null, facturaNombre = null;
    const fileEl = document.getElementById('r-factura');
    if(fileEl && fileEl.files && fileEl.files[0]){
      const file = fileEl.files[0];
      try{
        const dataUrl = await new Promise((res,rej)=>{
          const reader = new FileReader();
          reader.onload = ()=> res(reader.result);
          reader.onerror = rej;
          reader.readAsDataURL(file);
        });
        facturaKey = 'remito:'+uid();
        await storageSet(facturaKey, dataUrl);
        facturaNombre = file.name;
      }catch(e){ console.error('No se pudo leer el archivo', e); }
    }

    x.registros = x.registros || [];
    x.registros.push({id: uid(), fecha, cantidad: val, detalle, facturaKey, facturaNombre});

    if(val < pendiente && tipoEntrega==='final'){
      if(hayCompensacion){
        x.cerrado = true;
      } else {
        await showAlertModal(`No se puede cerrar esta línea porque no hay línea de ${x.variedad} en ${anioSig} para trasladar el faltante. Quedó registrada como entrega parcial.`, 'warn');
      }
    }
    // La compensación (de más o de menos) queda reflejada sola: se recalcula
    // automáticamente cada vez que se muestra el cronograma, a partir de lo
    // que esta línea terminó entregando. No hace falta guardar nada aparte.

    overlay.remove();
    render();
    persist().then(render);
  };
}

async function openBulkRegistroModal(tipo, contratoId, preselectId){
  const c = getContract(contratoId);
  const esCobro = tipo==='cobro';
  const items = esCobro ? c.cobros : c.entregas;
  const pendientes = items.filter(x=> esCobro ? !isPagado(x) : !isEntregadoFull(x)).map(x=>{
    const registrado = esCobro ? sumRegistrosMonto(x) : sumRegistrosCantidad(x);
    const totalX = esCobro ? x.monto : x.cantidad;
    return {x, pendiente: totalX - registrado};
  });
  if(pendientes.length===0){ await showAlertModal('No hay conceptos pendientes.', 'error'); return; }

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>${esCobro?'Registrar pago':'Registrar entrega'} — ${c.cliente}</h2><button class="btn btn-ghost" id="m-close">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Conceptos que cubre este ${esCobro?'pago':'movimiento'}</label>
          ${pendientes.map(p=>`
            <label class="check-item">
              <input type="checkbox" data-check-id="${p.x.id}" ${preselectId && preselectId===p.x.id ? 'checked' : ''}>
              <span class="mono" style="color:var(--text-faint); min-width:70px">${fmtDate(p.x.fecha)}</span>
              <span style="flex:1">${esCobro? p.x.concepto : (p.x.variedad+' — entrega '+p.x.anio)}</span>
              <span class="mono" style="color:var(--text-faint)">${esCobro? fmtUSD(p.pendiente) : fmtNum(p.pendiente)}</span>
            </label>`).join('')}
        </div>
        <div class="field"><label>Fecha</label><input type="date" id="r-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>${esCobro?'Monto total a registrar (USD)':'Cantidad total de plantas'}</label><input type="text" inputmode="numeric" id="r-monto"></div>
        <div class="field"><label>Detalle (opcional)</label><input type="text" id="r-detalle" placeholder="Ej: transferencia, comprobante N°..."></div>
        <div class="field"><label>Adjuntar ${esCobro?'factura':'remito'} (opcional)</label><input type="file" id="r-factura" accept=".pdf,.jpg,.jpeg,.png"></div>
        <div class="hint">Si tildás más de un concepto, el monto/cantidad ingresado se reparte proporcionalmente entre los seleccionados.</div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary" id="m-save">Guardar registro</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  attachAutoCap(document.getElementById('r-detalle'));
  attachThousandsFormat(document.getElementById('r-monto'));

  function recomputeDefault(){
    const checked = [...overlay.querySelectorAll('[data-check-id]:checked')].map(el=>el.dataset.checkId);
    const sum = pendientes.filter(p=>checked.includes(p.x.id)).reduce((s,p)=>s+p.pendiente,0);
    document.getElementById('r-monto').value = esCobro ? formatThousands(sum) : formatThousands(sum);
  }
  overlay.querySelectorAll('[data-check-id]').forEach(el=> el.addEventListener('change', recomputeDefault));
  recomputeDefault();

  document.getElementById('m-close').onclick = ()=> overlay.remove();
  document.getElementById('m-cancel').onclick = ()=> overlay.remove();
  document.getElementById('m-save').onclick = async ()=>{
    const checked = [...overlay.querySelectorAll('[data-check-id]:checked')].map(el=>el.dataset.checkId);
    if(checked.length===0){ await showAlertModal('Seleccioná al menos un concepto.', 'error'); return; }
    const fecha = document.getElementById('r-fecha').value;
    const totalVal = parseThousands(document.getElementById('r-monto').value);
    const detalle = document.getElementById('r-detalle').value.trim();
    if(!totalVal){ await showAlertModal('Ingresá un monto/cantidad mayor a 0.', 'error'); return; }

    const selPendientesCheck = pendientes.filter(p=>checked.includes(p.x.id));
    const sumPendienteCheck = selPendientesCheck.reduce((s,p)=>s+p.pendiente,0);
    let totalValClamped = totalVal;
    if(totalValClamped > sumPendienteCheck + 0.5){
      totalValClamped = sumPendienteCheck;
      await showAlertModal(`El ${esCobro?'monto':'cantidad'} no puede superar lo pendiente de los conceptos elegidos. Se ajustó a ${esCobro?fmtUSD(totalValClamped):fmtNum(totalValClamped)}.`, 'warn');
    }

    let facturaKey = null, facturaNombre = null;
    const fileEl = document.getElementById('r-factura');
    if(fileEl && fileEl.files && fileEl.files[0]){
      const file = fileEl.files[0];
      try{
        const dataUrl = await new Promise((res,rej)=>{
          const reader = new FileReader();
          reader.onload = ()=> res(reader.result);
          reader.onerror = rej;
          reader.readAsDataURL(file);
        });
        facturaKey = (esCobro?'factura:':'remito:')+uid();
        await storageSet(facturaKey, dataUrl);
        facturaNombre = file.name;
      }catch(e){ console.error('No se pudo leer el archivo', e); }
    }

    const selPendientes = pendientes.filter(p=>checked.includes(p.x.id));
    const sumPendiente = selPendientes.reduce((s,p)=>s+p.pendiente,0);
    selPendientes.forEach(p=>{
      const ratio = sumPendiente>0 ? (p.pendiente/sumPendiente) : (1/selPendientes.length);
      const porcion = Math.min(p.pendiente, Math.round(totalValClamped*ratio*100)/100);
      p.x.registros = p.x.registros || [];
      if(esCobro){
        p.x.registros.push({id: uid(), fecha, monto: porcion, detalle, facturaKey, facturaNombre});
      } else {
        p.x.registros.push({id: uid(), fecha, cantidad: porcion, detalle, facturaKey, facturaNombre});
      }
    });
    overlay.remove();
    render();
    persist().then(render);
  };
}

function openContractModal(c){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  const texto = generarTextoContrato(c);
  overlay.innerHTML = `
    <div class="modal modal-wide">
      <div class="modal-head"><h2>Contrato — ${c.cliente||''}</h2><button class="btn btn-ghost" id="m-close">✕</button></div>
      <div class="modal-body">
        <div class="contract-doc" id="print-area">${texto.replace(/</g,'&lt;')}</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="m-close2">Cerrar</button>
        <button class="btn" id="m-print">Imprimir / Exportar PDF</button>
        <button class="btn btn-highlight" id="m-word">Descargar Word (.docx)</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('m-close').onclick = ()=> overlay.remove();
  document.getElementById('m-close2').onclick = ()=> overlay.remove();
  document.getElementById('m-print').onclick = ()=> window.print();
  document.getElementById('m-word').onclick = ()=> descargarContratoWord(c);
}

load();
</script>
