<!DOCTYPE html>
<html lang="es">
<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

    --green: #00c870; --green-dim: rgba(0,200,112,0.14);
    --amber: #ffab40; --amber-dim: rgba(255,171,64,0.14);
    --purple: #b78cf0; --purple-dim: rgba(183,140,240,0.16);
    --red: #ff5470; --red-dim: rgba(255,84,112,0.14);

  .sidebar-top{flex-shrink:0;}
  .sidebar-bottom{margin-top:auto; padding-top:10px; border-top:1px solid var(--line);}

  @media (max-width:820px){
    #shell{flex-direction:column;}

    .sidebar-inner{flex-direction:row; align-items:center; gap:16px; padding:14px 16px;}

    .sidebar-brand{border-bottom:none; padding:0; margin-bottom:0; white-space:nowrap;}

  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim); padding:9px 10px;}

  .kpi .num.blue{color:var(--blue);} .kpi .num.green{color:var(--green);} .kpi .num.amber{color:var(--amber);} .kpi .num.purple{color:var(--purple);}

  .sect-head{display:flex; align-items:center; justify-content:space-between; margin:32px 0 12px; flex-wrap:wrap; gap:10px;}

  .cal-month{margin-bottom:18px;}

  .event-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; background:var(--card); border:1px solid var(--line-soft); border-radius:8px; margin-bottom:6px; flex-wrap:wrap; }

  .event-date{font-family:'JetBrains Mono',monospace; color:var(--text-faint); font-size:12px; min-width:60px;}

  .contract-card{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); padding:16px 18px; margin-bottom:10px; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .contract-card:hover{border-color:var(--blue); background:var(--card-hover);}
  .cc-name{font-weight:600; font-size:14.5px;}
  .cc-meta{color:var(--text-faint); font-size:12px; margin-top:2px;}
  .badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px; border-radius:20px;}
  .badge-borrador{background:var(--amber-dim); color:var(--amber);}
  .badge-firmado{background:var(--green-dim); color:var(--green);}
  .cc-right{display:flex; align-items:center; gap:22px;}
  .cc-stat{text-align:right;}
  .cc-stat .v{font-weight:700; font-size:14px;}
  .cc-stat .l{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}

  .empty{ border:1px dashed var(--line); border-radius:var(--radius); padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13px; }
  .notice{ border:1px solid var(--amber); background:var(--amber-dim); color:var(--amber); border-radius:var(--radius); padding:12px 16px; font-size:13px; margin-bottom:16px; }

  .overlay{ position:fixed; inset:0; background:rgba(7,10,16,0.72); backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow-y:auto; }
  .modal{ background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; width:100%; max-width:760px; padding:0; margin-bottom:40px; }
  .modal-wide{ max-width:960px; }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
  .modal-head h2{font-size:16px; margin:0; font-weight:700;}
  .modal-body{padding:22px; max-height:70vh; overflow-y:auto;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  .field .hint{color:var(--text-faint); font-size:11px; margin-top:6px; line-height:1.5;}
  input, select{ width:100%; background:var(--card); border:1px solid var(--line); color:var(--text); padding:9px 11px; border-radius:7px; font-size:13.5px; font-family:inherit; }
  input:focus, select:focus{outline:none; border-color:var(--blue);}
  input[disabled], select[disabled]{opacity:.55;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .item-row{display:grid; grid-template-columns:1.3fr .9fr 1fr auto; gap:10px; align-items:end; margin-bottom:8px;}
  .item-row .btn-ghost{padding:9px;}

  .month-toggle{display:flex; gap:8px; flex-wrap:wrap;}
  .month-toggle .btn.active{background:var(--blue); border-color:var(--blue); color:#08141f;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .tab{padding:10px 4px; margin-right:20px; color:var(--text-faint); font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--text); border-color:var(--blue);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:10px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tr.done td{color:var(--text-faint);}
  .amt{font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:-0.01em;}
  .tag{font-size:10.5px; padding:2px 7px; border-radius:5px; font-weight:700;}
  .tag-anticipo{background:var(--blue-dim); color:var(--blue);}
  .tag-saldo{background:var(--purple-dim); color:var(--purple);}
  .tag-regalia{background:var(--amber-dim); color:var(--amber);}
  .tag-entrega{background:var(--green-dim); color:var(--green);}
  .reg-list{font-size:11.5px; color:var(--text-faint); margin-top:6px;}
  .reg-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0;}
  .reg-list a{color:var(--blue);}
  .reg-actions{display:flex; gap:4px; flex-shrink:0;}
  .btn-icon{background:transparent; border:1px solid var(--line-soft); color:var(--text-faint); border-radius:5px; width:22px; height:22px; font-size:11px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0;}
  .btn-icon:hover{color:var(--text); border-color:var(--blue); background:var(--card);}
  .status-pagado{color:var(--green); font-weight:600;}
  .status-parcial{color:var(--amber); font-weight:600;}
  .status-comp{color:var(--amber); font-weight:600;}
  .nota-compensacion{color:var(--amber); font-size:11.5px; margin-top:3px; font-weight:500;}
  .status-pendiente{color:var(--text-faint);}
  .check-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line-soft); border-radius:7px; margin-bottom:6px; font-size:13px;}
  .check-item input{width:auto;}

  .detail-back{display:flex; align-items:center; gap:8px; color:var(--text-dim); cursor:pointer; font-size:13px; margin-bottom:16px; font-weight:600;}
  .detail-back:hover{color:var(--text);}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; flex-wrap:wrap; gap:12px;}
  .detail-head h1{font-size:20px; margin:0 0 4px;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .summary-strip{display:flex; gap:26px; padding:14px 0 20px; border-bottom:1px solid var(--line); margin-bottom:20px; flex-wrap:wrap;}
  .strip-item .l{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px;}
  .strip-item .v{font-weight:700; font-size:15px;}

  .progress-bar{height:6px; background:var(--line-soft); border-radius:4px; overflow:hidden; margin-top:6px;}
  .progress-fill{height:100%; background:var(--green);}

  .contract-doc{ background:#f4f1ea; color:#1a1a1a; padding:34px 38px; border-radius:6px; font-size:12px; line-height:1.6; font-family:'JetBrains Mono',monospace; white-space:pre; overflow-x:auto; max-height:62vh; overflow-y:auto; }

  @media (max-width:720px){
    .kpis{grid-template-columns:1fr 1fr;}
    .row2{grid-template-columns:1fr;}
    .item-row{grid-template-columns:1fr; }
  }
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; top:0; left:0; width:100%; white-space:pre; font-size:10px;}
  }
</style>

<script>
const STORAGE_KEY = 'contratos_plantines_v4';
const PROVEEDORES_KEY = 'proveedores_plantines_v1';
const PROVISIONES_KEY = 'provisiones_plantines_v1';
const DEMANDA_KEY = 'demanda_propia_v1';
let state = { contratos: [], proveedores: [], provisiones: [], demandaPropia: [], view: 'list', activeId: null, clienteActivo: null, tab: 'pedido', loaded:false, returnTo:'contratos', plantasModo:'todo', demandaVolModo:'todo', provisionVolModo:'todo', remoteError:null, balanceVariedad:'todas',
  filtro: {cliente:'todos', anio:'todos', mes:'todos', estado:'todos'} };

const VARIEDADES = ['Tafí','Slender','Moya','Según disponibilidad'];
const ANIOS = [2026,2027,2028,2029,2030];
const MESES_NOMBRE = {1:'enero',2:'febrero',3:'marzo',4:'abril',5:'mayo',6:'junio',7:'julio',8:'agosto',9:'septiembre',10:'octubre',11:'noviembre',12:'diciembre'};
const MESES_PAGO = { may_nov: {mes1:5, mes2:11, label:'Mayo / Noviembre'}, mar_sep: {mes1:3, mes2:9, label:'Marzo / Septiembre'} };
const CLIENT_COLORS = ['#4a9ee8','#00c870','#ffab40','#b78cf0','#ff5470','#2dd4da','#f472b6','#a3e635'];
const IVA_PCT = 0.21;

function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtUSD(n){ return '$' + Math.round(n||0).toLocaleString('es-AR'); }
function fmtNum(n){ return Math.round(n||0).toLocaleString('es-AR'); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function isoDate(y, m){ return `${y}-${String(m).padStart(2,'0')}-01`; }

/* Resuelve los 4 meses (anticipo/saldo/regalía1/regalía2) de un contrato.
   Prioriza los campos numéricos nuevos; si no existen, cae a los presets
   viejos (mesesPagoPlantas/mesesPagoRegalia/mesesPago) para contratos
   creados antes de tener selección libre de mes. */
function resolveMeses(c){
  const legacyPlantas = MESES_PAGO[c.mesesPagoPlantas || c.mesesPago] || MESES_PAGO.may_nov;
  const legacyRegalia = MESES_PAGO[c.mesesPagoRegalia || c.mesesPago] || MESES_PAGO.may_nov;
  return {
    mesPlantas1: c.mesPlantas1 || legacyPlantas.mes1,
    mesPlantas2: c.mesPlantas2 || legacyPlantas.mes2,
    mesRegalia1: c.mesRegalia1 || legacyRegalia.mes1,
    mesRegalia2: c.mesRegalia2 || legacyRegalia.mes2,
  };
}
function nombreMes(m){ const n = MESES_NOMBRE[Number(m)]||''; return n ? n[0].toUpperCase()+n.slice(1) : ''; }
function parseThousands(str){ return Number(String(str||'').replace(/\./g,'').replace(/[^0-9-]/g,''))||0; }
function formatThousands(n){ return Math.round(n||0).toLocaleString('es-AR'); }

/* ---------- storage abstraction ----------
   Priority order:
   1. Remote backend (Google Apps Script + Drive) — if configured, this is the ONLY
      source of truth, so every device/browser that has the same URL+clave sees the
      same data. Configured once per device via the "Configuración" screen.
   2. window.storage — works automatically inside Claude's artifact viewer.
   3. localStorage — fallback so data isn't lost even without any of the above,
      but stays local to that one browser/file location.
------------------------------------------------------------------ */
const LS_PREFIX = 'plantines_';
const CONFIG_KEY = 'plantines_config';

/* Backend compartido: una vez desplegado el Apps Script, la URL y la clave se
   pegan ACA — así el archivo ya viene conectado para cualquiera que lo abra,
   sin tener que configurar nada por navegador. La pantalla de "Configuración"
   solo sirve para un override puntual (poco frecuente). */
const DEFAULT_REMOTE_URL = 'https://script.google.com/macros/s/AKfycbzzWZVPfh1feTjND_Zez8izValgnEBPdWur6tljpuIYiVobZZpOs5sUA_YvMbprBIWy/exec';
const DEFAULT_REMOTE_KEY = 'EARLYCROPSB2026';

function getRemoteConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    const override = raw ? JSON.parse(raw) : null;
    if(override && override.url) return override;
  }catch(e){}
  return {url: DEFAULT_REMOTE_URL, key: DEFAULT_REMOTE_KEY};
}
function setRemoteConfig(cfg){
  try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); return true; }
  catch(e){ return false; }
}
function clearRemoteConfigOverride(){
  try{ localStorage.removeItem(CONFIG_KEY); return true; }catch(e){ return false; }
}

async function remoteGet(key){
  const cfg = getRemoteConfig();
  if(!cfg.url) return undefined; // not configured — let caller fall through
  try{
    const res = await fetch(`${cfg.url}?key=${encodeURIComponent(cfg.key)}&storageKey=${encodeURIComponent(key)}`);
    const text = await res.text();
    if(text==='unauthorized') throw new Error('Clave incorrecta en la configuración remota.');
    return text ? {value:text} : null;
  }catch(e){ console.error('remoteGet failed', e); throw e; }
}
async function remoteSet(key, value){
  const cfg = getRemoteConfig();
  if(!cfg.url) return undefined;
  try{
    const res = await fetch(cfg.url, {
      method:'POST',
      headers:{'Content-Type':'text/plain'}, // avoids CORS preflight against Apps Script
      body: JSON.stringify({key:cfg.key, storageKey:key, data:value})
    });
    const text = await res.text();
    if(text==='unauthorized') throw new Error('Clave incorrecta en la configuración remota.');
    return true;
  }catch(e){ console.error('remoteSet failed', e); throw e; }
}

async function storageGet(key){
  const cfg = getRemoteConfig();
  if(cfg.url){
    try{ return await remoteGet(key); }
    catch(e){ state.remoteError = e.message || 'No se pudo conectar con el almacenamiento remoto.'; return null; }
  }
  if(typeof window!=='undefined' && window.storage){
    try{ return await window.storage.get(key, false); }catch(e){}
  }
  try{
    const v = localStorage.getItem(LS_PREFIX+key);
    return v!=null ? {value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  const cfg = getRemoteConfig();
  if(cfg.url){
    try{ await remoteSet(key, value); state.remoteError = null; return true; }
    catch(e){ state.remoteError = e.message || 'No se pudo conectar con el almacenamiento remoto.'; return false; }
  }
  if(typeof window!=='undefined' && window.storage){
    try{ await window.storage.set(key, value, false); return true; }catch(e){}
  }
  try{ localStorage.setItem(LS_PREFIX+key, value); return true; }
  catch(e){ return false; }
}

async function load(){
  try{
    const res = await storageGet(STORAGE_KEY);
    state.contratos = res ? JSON.parse(res.value) : [];
  }catch(e){ state.contratos = []; }
  try{
    const resP = await storageGet(PROVEEDORES_KEY);
    state.proveedores = resP ? JSON.parse(resP.value) : [];
  }catch(e){ state.proveedores = []; }
  try{
    const resPr = await storageGet(PROVISIONES_KEY);
    state.provisiones = resPr ? JSON.parse(resPr.value) : [];
  }catch(e){ state.provisiones = []; }
  try{
    const resD = await storageGet(DEMANDA_KEY);
    state.demandaPropia = resD ? JSON.parse(resD.value) : [];
  }catch(e){ state.demandaPropia = []; }
  state.loaded = true;
  // Migración: versiones anteriores guardaban la compensación como un registro
  // aparte que había que mantener sincronizado a mano. Ahora se calcula sola,
  // así que cualquier registro de compensación guardado de antes ya no hace
  // falta (y podía quedar desactualizado) — se limpia automáticamente.
  let huboLimpieza = false;
  (state.contratos||[]).forEach(c=>{
    (c.entregas||[]).forEach(x=>{
      if(x.registros && x.registros.some(r=>r.esCompensacion)){
        x.registros = x.registros.filter(r=>!r.esCompensacion);
        huboLimpieza = true;
      }
      if(x.cerradoPorRegistroId!==undefined){ delete x.cerradoPorRegistroId; huboLimpieza = true; }
    });
  });
  if(huboLimpieza) persist();
  // Migración: versión anterior de Provisión mezclaba proveedor y cantidades
  // en una sola "fuente". Se separa en Proveedores (dato maestro) + Provisiones
  // (cuánto y cuándo), y la fecha completa pasa a ser solo mes/año.
  try{
    const resOldFuentes = await storageGet('fuentes_plantines_v1');
    if(resOldFuentes && resOldFuentes.value){
      const oldFuentes = JSON.parse(resOldFuentes.value);
      if(Array.isArray(oldFuentes) && oldFuentes.length>0 && state.proveedores.length===0 && state.provisiones.length===0){
        oldFuentes.forEach(f=>{
          const provId = uid();
          state.proveedores.push({id: provId, nombre: f.nombre, tipo: f.tipo||'tercero'});
          state.provisiones.push({id: uid(), proveedorId: provId, items: (f.items||[]).map(it=>{
            let mes = 1, anio = Number(it.anio)||new Date().getFullYear();
            if(it.fecha){ const parts = String(it.fecha).split('-'); if(parts.length>=2){ anio = Number(parts[0])||anio; mes = Number(parts[1])||1; } }
            return {variedad: it.variedad, cantidad: it.cantidad, mesEntrega: mes, anioEntrega: anio};
          })});
        });
        await persistProveedores();
        await persistProvisiones();
      }
    }
  }catch(e){ console.error('Migración de fuentes falló', e); }
  render();
}

/* ---------- schedule computation ---------- */
function computeSchedule(c){
  const cobros = [];
  const entregas = [];
  const fFirma = c.fechaFirma || new Date().toISOString().slice(0,10);
  const mesesR = resolveMeses(c);
  const mesesPlantas = {mes1: mesesR.mesPlantas1, mes2: mesesR.mesPlantas2};
  const mesesRegalia = {mes1: mesesR.mesRegalia1, mes2: mesesR.mesRegalia2};
  const years = [...new Set(c.items.map(i=>Number(i.anio)))].sort((a,b)=>a-b);
  function resolve(rawIso){ return (rawIso <= fFirma) ? {fecha: fFirma, esFirma:true} : {fecha: rawIso, esFirma:false}; }

  let totalRegalia = 0;
  years.forEach(y=>{
    const items = c.items.filter(i=>Number(i.anio)===y);
    const plantas = items.reduce((s,i)=>s+Number(i.cantidad||0),0);
    const base = plantas * c.precioBase;
    const anticipo = base * 0.30;
    const saldo = base * 0.70;
    totalRegalia += plantas * c.regalia;

    const antR = resolve(isoDate(y-1, mesesPlantas.mes1));
    cobros.push({id: uid(), key:`anticipo-${y}`, tipo:'anticipo', anio:y, plantas, fecha: antR.fecha, esFirma: antR.esFirma,
      concepto:`Anticipo 30% — reserva entrega ${y}`, monto: anticipo, registros:[]});

    const saldoR = resolve(isoDate(y, mesesPlantas.mes2));
    cobros.push({id: uid(), key:`saldo-${y}`, tipo:'saldo', anio:y, plantas, fecha: saldoR.fecha, esFirma: saldoR.esFirma,
      concepto:`Saldo 70% — entrega ${y}`, monto: saldo, registros:[]});

    items.forEach(it=>{
      entregas.push({id: uid(), key:`entrega-${it.variedad}-${y}`, variedad: it.variedad, anio: y,
        fecha: isoDate(y, mesesPlantas.mes2), cantidad: Number(it.cantidad||0), registros:[]});
    });
  });

  const nCuotas = years.length * 2;
  const cuotaMonto = nCuotas>0 ? totalRegalia / nCuotas : 0;
  if(nCuotas>0){
    const raws = [];
    years.forEach(y=>{ raws.push(isoDate(y, mesesRegalia.mes1)); raws.push(isoDate(y, mesesRegalia.mes2)); });
    raws.sort();
    raws.forEach((raw, idx)=>{
      const r = resolve(raw);
      cobros.push({id: uid(), key:`regalia-${idx+1}`, tipo:'regalia', fecha: r.fecha, esFirma:r.esFirma,
        concepto:`Regalía — cuota ${idx+1}/${nCuotas}`, monto: cuotaMonto, registros:[]});
    });
  }
  cobros.sort((a,b)=> a.fecha.localeCompare(b.fecha));
  entregas.sort((a,b)=> a.fecha.localeCompare(b.fecha));
  return {cobros, entregas, totalRegalia, years, nCuotas};
}

function recalcContract(c){
  const prevCobros = c.cobros || [];
  const prevEntregas = c.entregas || [];
  const {cobros, entregas} = computeSchedule(c);
  cobros.forEach(nc=>{ const match = prevCobros.find(pc=>pc.key===nc.key); if(match){ nc.registros = match.registros||[]; } });
  entregas.forEach(ne=>{ const match = prevEntregas.find(pe=>pe.key===ne.key); if(match){ ne.registros = match.registros||[]; } });
  c.cobros = cobros;
  c.entregas = entregas;
}

function sumRegistrosMonto(x){ return (x.registros||[]).reduce((s,r)=>s+Number(r.monto||0),0); }
function sumRegistrosCantidad(x){ return (x.registros||[]).reduce((s,r)=>s+Number(r.cantidad||0),0); }
function isPagado(x){ return sumRegistrosMonto(x) >= x.monto - 1; }

/* Compensación entre años (misma variedad): en vez de guardarla como un
   registro aparte que hay que mantener sincronizado a mano, se calcula
   siempre en el momento a partir de lo realmente entregado. Así nunca
   puede quedar desactualizada. */
function attachCarry(c){
  const porVariedad = {};
  (c.entregas||[]).forEach(x=>{ (porVariedad[x.variedad]=porVariedad[x.variedad]||[]).push(x); });
  Object.values(porVariedad).forEach(items=>{
    items.sort((a,b)=>Number(a.anio)-Number(b.anio));
    let carry = 0;
    items.forEach(x=>{
      const cantidadNum = Number(x.cantidad) || 0;
      const efectivo = cantidadNum - carry;
      const registrado = sumRegistrosCantidad(x);
      const diff = registrado - efectivo;
      x._carryIn = carry;
      x._efectivo = efectivo;
      x._registrado = registrado;
      x._diff = Math.round(diff*100)/100;
      if(diff > 0.01) carry = diff;
      else if(diff < -0.01 && x.cerrado) carry = diff;
      else carry = 0;
    });
  });
}

function isEntregadoFull(x){
  const target = (x._efectivo!=null) ? x._efectivo : x.cantidad;
  return !!x.cerrado || sumRegistrosCantidad(x) >= target - 0.001;
}

function estadoTexto(tipo, total, registrado, efectivo, pagado){
  if(pagado) return {texto: tipo==='cobro'?'Cobrado':'Entregado', clase:'status-pagado'};
  if(tipo==='entrega' && efectivo!=null && Math.abs(efectivo - Number(total))>0.01){
    const pendiente = Math.max(0, efectivo - registrado);
    return {texto: `Ajustado por compensación — faltan ${fmtNum(pendiente)}`, clase:'status-comp'};
  }
  if(registrado>0) return {texto:`Parcial (${tipo==='cobro'?fmtUSD(registrado):fmtNum(registrado)})`, clase:'status-parcial'};
  return {texto:'Pendiente', clase:'status-pendiente'};
}

function notaCompensacionOrigen(x){
  if(x._diff==null) return null;
  const anioSig = Number(x.anio) + 1;
  if(x._diff > 0.01){
    return `Entregaste ${fmtNum(x._diff)} de más sobre lo pactado — se descuenta de ${x.variedad} en ${anioSig}`;
  }
  if(x.cerrado && x._diff < -0.01){
    return `Cerrada con ${fmtNum(-x._diff)} de faltante — se suma a ${x.variedad} en ${anioSig}`;
  }
  return null;
}
function notaCompensacionOrigenEvento(e){
  if(e.diff==null) return null;
  const anioSig = Number(e.anio) + 1;
  const variedad = e.concepto.split(' — ')[0];
  if(e.diff > 0.01){
    return `Entregaste ${fmtNum(e.diff)} de más sobre lo pactado — se descuenta de ${variedad} en ${anioSig}`;
  }
  if(e.cerrado && e.diff < -0.01){
    return `Cerrada con ${fmtNum(-e.diff)} de faltante — se suma a ${variedad} en ${anioSig}`;
  }
  return null;
}

function totals(c){
  attachCarry(c);
  const totalPlantas = c.items.reduce((s,i)=>s+Number(i.cantidad||0),0);
  const valorBase = c.items.reduce((s,i)=>s+i.cantidad*c.precioBase,0);
  const valorRegalia = totalPlantas * c.regalia;
  const valorTotal = valorBase + valorRegalia;
  const cobrado = (c.cobros||[]).reduce((s,x)=>s + sumRegistrosMonto(x),0);
  const entregado = (c.entregas||[]).reduce((s,x)=> s + sumRegistrosCantidad(x),0);
  const iva = valorTotal * IVA_PCT;
  const ivaCobrado = cobrado * IVA_PCT;
  return {totalPlantas, valorBase, valorRegalia, valorTotal, cobrado, entregado, iva, ivaCobrado, totalConImp: valorTotal+iva};
}

/* ---------- form <-> state sync ---------- */
function syncFormToState(c){
  const numericFields = ['precioBase','regalia','mesPlantas1','mesPlantas2','mesRegalia1','mesRegalia2'];
  document.querySelectorAll('[data-field]').forEach(el=>{
    const f = el.dataset.field;
    c[f] = numericFields.includes(f) ? Number(el.value) : el.value;
  });
  document.querySelectorAll('.item-row').forEach(row=>{
    const idx = Number(row.dataset.idx);
    if(!c.items[idx]) return;
    row.querySelectorAll('[data-item-field]').forEach(el=>{
      const f = el.dataset.itemField;
      c.items[idx][f] = (f==='cantidad') ? parseThousands(el.value) : (f==='anio' ? Number(el.value) : el.value);
    });
  });
}

function renderPlantasPorAnio(){
  const firmados = state.contratos.filter(c=>c.estado==='firmado');
  const years = [...new Set(firmados.flatMap(c=>c.items.map(i=>Number(i.anio))))].sort((a,b)=>a-b);

  let bodyHtml = '';

  if(modo==='anio'){
    const anioTotals = years.map(y=>({
      anio: y,
      total: firmados.flatMap(c=>c.items).filter(i=>Number(i.anio)===y).reduce((s,i)=>s+Number(i.cantidad||0),0)
    }));
    const maxV = Math.max(1, ...anioTotals.map(a=>a.total));
    const grand = anioTotals.reduce((s,a)=>s+a.total,0);
    bodyHtml = anioTotals.length===0 ? `<div class="empty">Todavía no hay contratos firmados.</div>` : `
      <div class="pv-card" style="padding:20px 22px;">
        ${anioTotals.map(a=>`
          <div class="pv-bar-row">
            <div class="pv-bar-label">${a.anio}</div>
            <div class="pv-bar-track"><div class="pv-bar-fill" style="width:${Math.round(a.total/maxV*100)}%"></div></div>
            <div class="pv-bar-value">${fmtNum(a.total)}</div>
          </div>`).join('')}
      </div>
      <div class="hint" style="margin-top:12px">Total general: ${fmtNum(grand)} plantas</div>
    `;
  } else {
    const map = {};
    firmados.forEach(c=>{
      c.items.forEach(it=>{
        let key, cliente=null, variedad=null;
        if(modo==='todo'){ key = c.cliente+'|||'+it.variedad; cliente=c.cliente; variedad=it.variedad; }
        else if(modo==='cliente'){ key = c.cliente; cliente=c.cliente; }
        else { key = it.variedad; variedad=it.variedad; }
        if(!map[key]) map[key] = {cliente, variedad, porAnio:{}, total:0};
        const y = Number(it.anio);
        map[key].porAnio[y] = (map[key].porAnio[y]||0) + Number(it.cantidad||0);
        map[key].total += Number(it.cantidad||0);
      });
    });
    let rows = Object.values(map);
    if(modo==='todo') rows.sort((a,b)=> a.cliente.localeCompare(b.cliente) || a.variedad.localeCompare(b.variedad));
    else if(modo==='cliente') rows.sort((a,b)=> a.cliente.localeCompare(b.cliente));
    else rows.sort((a,b)=> a.variedad.localeCompare(b.variedad));

    const totalYear = {}; years.forEach(y=> totalYear[y] = rows.reduce((s,r)=>s+(r.porAnio[y]||0),0));
    const grandTotal = rows.reduce((s,r)=>s+r.total,0);
    const nLabelCols = modo==='todo' ? 2 : 1;
    const clientesUnicos = [...new Set(rows.map(r=>r.cliente).filter(Boolean))];
    const colorFor = cliente => CLIENT_COLORS[clientesUnicos.indexOf(cliente) % CLIENT_COLORS.length];

    bodyHtml = rows.length===0 ? `<div class="empty">Todavía no hay contratos firmados.</div>` : `
      <div class="pv-card">
      <table>
        <thead><tr>${modo==='todo'?'<th>Cliente</th><th>Variedad</th>':modo==='cliente'?'<th>Cliente</th>':'<th>Variedad</th>'}${years.map(y=>`<th>${y}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody>
        ${rows.map(r=>{
          const borderStyle = (modo==='todo'||modo==='cliente') ? `style="border-left:3px solid ${colorFor(r.cliente)}"` : '';
          const firstCell = modo==='todo'?`<td ${borderStyle}>${r.cliente}</td><td>${r.variedad}</td>`:modo==='cliente'?`<td ${borderStyle}>${r.cliente}</td>`:`<td>${r.variedad}</td>`;
          return `<tr>${firstCell}${years.map(y=>`<td>${r.porAnio[y]>0?fmtNum(r.porAnio[y]):'—'}</td>`).join('')}<td style="font-weight:700">${fmtNum(r.total)}</td></tr>`;

        </tbody>
      </table>
      </div>
    `;
  }

  return `
    <div class="topbar"><div><h1>Volúmenes</h1><div class="sub">Plantas comprometidas por cliente, variedad y año — contratos firmados</div></div></div>
    <div class="filters">

        <option value="cliente" ${modo==='cliente'?'selected':''}>Ver por cliente</option>
        <option value="variedad" ${modo==='variedad'?'selected':''}>Ver por variedad</option>
        <option value="anio" ${modo==='anio'?'selected':''}>Ver por año</option>
      </select>
    </div>

  `;
}

    let rows = Object.values(map);
    if(modo==='todo') rows.sort((a,b)=> a.entidad.localeCompare(b.entidad) || a.variedad.localeCompare(b.variedad));
    else if(modo==='entidad') rows.sort((a,b)=> a.entidad.localeCompare(b.entidad));
    else rows.sort((a,b)=> a.variedad.localeCompare(b.variedad));

    const totalYear = {}; years.forEach(y=> totalYear[y] = rows.reduce((s,r)=>s+(r.porAnio[y]||0),0));
    const grandTotal = rows.reduce((s,r)=>s+r.total,0);
    const nLabelCols = modo==='todo' ? 2 : 1;
    const entidadesUnicas = [...new Set(rows.map(r=>r.entidad).filter(Boolean))];
    const colorFor = entidad => CLIENT_COLORS[entidadesUnicas.indexOf(entidad) % CLIENT_COLORS.length];

    bodyHtml = rows.length===0 ? `<div class="empty">${cfg.emptyMsg}</div>` : `
      <div class="pv-card">
      <table>
        <thead><tr>${modo==='todo'?`<th>${cfg.entidadLabel}</th><th>Variedad</th>`:modo==='entidad'?`<th>${cfg.entidadLabel}</th>`:'<th>Variedad</th>'}${years.map(y=>`<th>${y}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody>
        ${rows.map(r=>{
          const borderStyle = (modo==='todo'||modo==='entidad') ? `style="border-left:3px solid ${colorFor(r.entidad)}"` : '';
          const firstCell = modo==='todo'?`<td ${borderStyle}>${r.entidad}</td><td>${r.variedad}</td>`:modo==='entidad'?`<td ${borderStyle}>${r.entidad}</td>`:`<td>${r.variedad}</td>`;
          return `<tr>${firstCell}${years.map(y=>`<td>${r.porAnio[y]>0?fmtNum(r.porAnio[y]):'—'}</td>`).join('')}<td style="font-weight:700">${fmtNum(r.total)}</td></tr>`;
        }).join('')}
        <tr class="pv-total"><td colspan="${nLabelCols}">TOTAL</td>${years.map(y=>`<td>${fmtNum(totalYear[y])}</td>`).join('')}<td>${fmtNum(grandTotal)}</td></tr>
        </tbody>
      </table>
      </div>
    `;
  }

  return `
    <div class="topbar"><div><h1>${cfg.titulo}</h1><div class="sub">${cfg.subtitulo}</div></div></div>
    <div class="filters">
      <select id="${cfg.selectId}">
        <option value="todo" ${modo==='todo'?'selected':''}>Ver por ${cfg.entidadLabel.toLowerCase()} y variedad</option>
        <option value="entidad" ${modo==='entidad'?'selected':''}>Ver por ${cfg.entidadLabel.toLowerCase()}</option>
        <option value="variedad" ${modo==='variedad'?'selected':''}>Ver por variedad</option>
        <option value="anio" ${modo==='anio'?'selected':''}>Ver por año</option>
      </select>
    </div>
    ${bodyHtml}
  `;
}

function buildEventos(){
  const firmados = state.contratos.filter(c=>c.estado==='firmado');
  let eventos = [];
  firmados.forEach(c=>{
    attachCarry(c);
    (c.cobros||[]).forEach(x=>{
      eventos.push({fecha:x.fecha, cliente:c.cliente, contratoId:c.id, xId:x.id, tipo:'cobro', subtipo:x.tipo, concepto:x.concepto, monto:x.monto, registros:x.registros||[], registrado:sumRegistrosMonto(x), efectivo:x.monto, pagado:isPagado(x)});
    });
    (c.entregas||[]).forEach(x=>{
      eventos.push({fecha:x.fecha, cliente:c.cliente, contratoId:c.id, xId:x.id, tipo:'entrega', subtipo:'entrega', concepto:`${x.variedad} — entrega ${x.anio}`, cantidad:x.cantidad, anio:x.anio, cerrado:!!x.cerrado, registros:x.registros||[], registrado:sumRegistrosCantidad(x), efectivo:x._efectivo, diff:x._diff, pagado:isEntregadoFull(x)});
    });
  });
  return eventos;
}

function renderCronograma(tipoFiltro){
  const all = buildEventos().filter(e=> !tipoFiltro || e.tipo===tipoFiltro);
  const clientes = [...new Set(all.map(e=>e.cliente))].sort();
  const anios = [...new Set(all.map(e=>e.fecha.slice(0,4)))].sort();
  const baseParaMeses = all.filter(e=>
    (state.filtro.cliente==='todos' || e.cliente===state.filtro.cliente) &&
    (state.filtro.anio==='todos' || e.fecha.slice(0,4)===state.filtro.anio)
  );
  const mesesDisponibles = [...new Set(baseParaMeses.map(e=>e.fecha.slice(5,7)))].sort();
  const hoy = new Date().toISOString().slice(0,10);
  let eventos = all.filter(e=>{
    if(state.filtro.cliente!=='todos' && e.cliente!==state.filtro.cliente) return false;
    if(state.filtro.anio!=='todos' && e.fecha.slice(0,4)!==state.filtro.anio) return false;
    if(state.filtro.mes!=='todos' && e.fecha.slice(5,7)!==state.filtro.mes) return false;
    if(state.filtro.estado==='pagado' && !e.pagado) return false;
    if(state.filtro.estado==='pendiente' && e.pagado) return false;
    if(state.filtro.estado==='vencido' && (e.pagado || e.fecha >= hoy)) return false;
    return true;
  });
  eventos.sort((a,b)=> a.fecha.localeCompare(b.fecha) || a.cliente.localeCompare(b.cliente));

  const groups = {};
  eventos.forEach(e=>{ const k = e.fecha.slice(0,7); (groups[k]=groups[k]||[]).push(e); });
  const monthKeys = Object.keys(groups).sort();

  return `
    <div class="sect-head" style="margin-top:14px"><span class="count">${eventos.length} vencimientos</span></div>
    <div class="filters">
      <select id="f-cliente">
        <option value="todos">Todos los clientes</option>
        ${clientes.map(cl=>`<option value="${cl}" ${state.filtro.cliente===cl?'selected':''}>${cl}</option>`).join('')}
      </select>
      <select id="f-anio">
        <option value="todos">Todos los años</option>
        ${anios.map(a=>`<option value="${a}" ${state.filtro.anio===a?'selected':''}>${a}</option>`).join('')}
      </select>
      <select id="f-mes">
        <option value="todos">Todos los meses</option>
        ${mesesDisponibles.map(n=>`<option value="${n}" ${state.filtro.mes===n?'selected':''}>${MESES_NOMBRE[Number(n)][0].toUpperCase()+MESES_NOMBRE[Number(n)].slice(1)}</option>`).join('')}
      </select>
      <select id="f-estado">
        <option value="todos">Todos los estados</option>
        <option value="pagado" ${state.filtro.estado==='pagado'?'selected':''}>${tipoFiltro==='entrega'?'Entregado':'Cobrado'}</option>
        <option value="pendiente" ${state.filtro.estado==='pendiente'?'selected':''}>Pendiente</option>
        <option value="vencido" ${state.filtro.estado==='vencido'?'selected':''}>Vencido</option>
      </select>
    </div>
    ${monthKeys.length===0 ? `<div class="empty">No hay vencimientos para este filtro. ${all.length===0? 'Todavía no hay contratos firmados.':''}</div>` :
      monthKeys.map(k=>{
        const [y,m] = k.split('-');
        const label = `${MESES_NOMBRE[Number(m)]} ${y}`;
        return `<div class="cal-month"><h3>${label}</h3>${groups[k].map(e=>{
          const estado = estadoTexto(e.tipo, e.tipo==='cobro'?e.monto:e.cantidad, e.registrado, e.efectivo, e.pagado);
          const estadoTxt = estado.texto, estadoClass = estado.clase;
          const nota = e.tipo==='entrega' ? notaCompensacionOrigenEvento(e) : null;
          const regListHtml = (e.registros && e.registros.length) ? `<div class="reg-list">${e.registros.map(r=>`
            <div class="reg-item">
              <span${r.esCompensacion?' style="color:var(--amber)"':''}>${fmtDate(r.fecha)} — ${r.esCompensacion?`<span class="tag tag-regalia">compensación</span> `:''}${e.tipo==='cobro'?fmtUSD(r.monto):((r.esCompensacion&&r.cantidad>=0?'+':'')+fmtNum(r.cantidad))}${r.detalle?' — '+r.detalle:''}${r.facturaKey?` — <a href="#" data-ver-factura="${r.facturaKey}">${e.tipo==='cobro'?'ver factura':'ver remito'}</a>`:''}</span>
              ${!r.esCompensacion ? `<span class="reg-actions"><button class="btn-icon" title="Editar" data-editar-registro="${e.tipo}:${e.contratoId}:${e.xId}:${r.id}">✎</button><button class="btn-icon" title="Eliminar" data-borrar-registro="${e.tipo}:${e.contratoId}:${e.xId}:${r.id}">✕</button></span>` : ''}
            </div>`).join('')}</div>` : '';
          return `<div class="event-row" style="align-items:flex-start; flex-direction:column; gap:8px;">
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; flex-wrap:wrap; gap:12px;">
              <div class="event-left">
                <span class="event-date">${fmtDate(e.fecha)}</span>
                <span class="event-client">${e.cliente}</span>
                <span class="tag tag-${e.subtipo}">${e.subtipo}</span>
                <span class="event-concept">${e.concepto}${e.tipo==='entrega' && (e.diff>0.01 || (e.cerrado && e.diff<-0.01) || (e.efectivo!=null && Math.abs(e.efectivo-Number(e.cantidad))>0.01)) ? ' <span class="tag tag-regalia">compensación</span>' : ''}</span>
              </div>
              <div style="display:flex; align-items:center; gap:12px;">
                <span class="event-amt">${e.tipo==='cobro'? fmtUSD(e.monto) : fmtNum(e.cantidad)+' plantas'}</span>
                <span class="${estadoClass}" style="font-size:12px">${estadoTxt}</span>
                ${!e.pagado ? `<button class="btn btn-sm" data-registrar="${e.tipo}:${e.contratoId}:${e.xId}">+ Registrar</button>` : ''}
                ${e.tipo==='entrega' && e.cerrado ? `<button class="btn btn-sm btn-ghost" data-reabrir="${e.contratoId}:${e.xId}">↺ Reabrir</button>` : ''}
              </div>
            </div>
            ${nota ? `<div class="nota-compensacion" style="width:100%">${nota}</div>` : ''}
            ${regListHtml}
          </div>`;
        }).join('')}</div>`;
      }).join('')
    }
  `;
}

function renderProximos(tipo, n){
  const firmados = state.contratos.filter(c=>c.estado==='firmado');
  let eventos = [];
  firmados.forEach(c=>{
    if(tipo==='entrega') attachCarry(c);
    const arr = tipo==='cobro' ? (c.cobros||[]) : (c.entregas||[]);
    arr.forEach(x=>{
      const registrado = tipo==='cobro' ? sumRegistrosMonto(x) : sumRegistrosCantidad(x);
      const completo = tipo==='cobro' ? isPagado(x) : isEntregadoFull(x);
      if(completo) return;
      eventos.push({
        fecha: x.fecha, cliente: c.cliente, tipo, subtipo: tipo==='cobro' ? x.tipo : 'entrega',
        concepto: tipo==='cobro' ? x.concepto : `${x.variedad} — entrega ${x.anio}`,
        monto: x.monto, cantidad: x.cantidad, registrado, pagado:false,
        efectivo: tipo==='entrega' ? x._efectivo : x.monto, diff: tipo==='entrega' ? x._diff : null
      });
    });
  });
  eventos.sort((a,b)=> a.fecha.localeCompare(b.fecha));
  eventos = eventos.slice(0, n);
  const titulo = tipo==='cobro' ? 'Próximos cobros' : 'Próximas entregas';
  const verTodos = tipo==='cobro' ? 'cobros' : 'entregas';
  return `
    <div class="sect-head"><h2>${titulo}</h2><span class="count" data-nav-link="${verTodos}" style="cursor:pointer; color:var(--blue);">Ver todos →</span></div>
    ${eventos.length===0 ? `<div class="empty">No hay ${tipo==='cobro'?'cobros':'entregas'} pendientes.</div>` :
      eventos.map(e=>{
        const estado = estadoTexto(tipo, tipo==='cobro'?e.monto:e.cantidad, e.registrado, e.efectivo, e.pagado);
        const registradoTxt = `<span class="${estado.clase}" style="font-size:12px">${estado.texto}</span>`;
        return `<div class="event-row">
          <div class="event-left">
            <span class="event-date">${fmtDate(e.fecha)}</span>
            <span class="event-client">${e.cliente}</span>
            <span class="tag tag-${e.subtipo}">${e.subtipo}</span>
            <span class="event-concept">${e.concepto}${e.tipo==='entrega' && (e.diff>0.01 || (e.cerrado && e.diff<-0.01) || (e.efectivo!=null && Math.abs(e.efectivo-Number(e.cantidad))>0.01)) ? ' <span class="tag tag-regalia">compensación</span>' : ''}</span>
          </div>
          <div style="display:flex; align-items:center; gap:16px;">
            <span class="event-amt">${tipo==='cobro'? fmtUSD(e.monto) : fmtNum(e.cantidad)+' plantas'}</span>
            ${registradoTxt}
          </div>
        </div>`;
      }).join('')
    }
  `;
}

function buildClientesResumen(){
  const nombres = [...new Set(state.contratos.map(c=>c.cliente))].filter(Boolean).sort();
  return nombres.map(nombre=>{
    const contratos = state.contratos.filter(c=>c.cliente===nombre);
    const firmados = contratos.filter(c=>c.estado==='firmado');
    const agg = firmados.map(c=>totals(c));
    const totalPlantas = agg.reduce((s,t)=>s+t.totalPlantas,0);
    const valorTotal = agg.reduce((s,t)=>s+t.valorTotal,0);
    const cobrado = agg.reduce((s,t)=>s+t.cobrado,0);
    const entregado = agg.reduce((s,t)=>s+t.entregado,0);
    let proximo = null;
    firmados.forEach(c=>{ (c.cobros||[]).forEach(x=>{ if(!isPagado(x) && (!proximo || x.fecha<proximo.fecha)) proximo = x; }); });
    return {
      nombre, nContratos: contratos.length, nFirmados: firmados.length, totalPlantas, valorTotal, cobrado, entregado,
      pctCobrado: valorTotal>0 ? Math.round(cobrado/valorTotal*100) : 0,
      pctEntregado: totalPlantas>0 ? Math.round(entregado/totalPlantas*100) : 0,
      proximo
    };
  });
}

  const clientes = buildClientesResumen();
  return `

    <div class="sect-head"><h2>Clientes</h2><span class="count">${clientes.length} en total</span></div>

          <div class="cc-meta">${cl.nContratos} contrato${cl.nContratos!==1?'s':''} (${cl.nFirmados} firmado${cl.nFirmados!==1?'s':''}) · ${fmtNum(cl.totalPlantas)} plantas</div>
        </div></div>
        ${cl.nFirmados>0 ? `<div class="cc-right">
          <div class="cc-stat"><div class="v">${fmtUSD(cl.valorTotal)}</div><div class="l">Valor total</div></div>
          <div class="cc-stat"><div class="v" style="color:var(--green)">${cl.pctCobrado}%</div><div class="l">Cobrado</div></div>
          <div class="cc-stat"><div class="v" style="color:var(--blue)">${cl.pctEntregado}%</div><div class="l">Entregado</div></div>
        </div>` : `<div class="cc-right"><div class="cc-stat"><div class="l" style="color:var(--amber)">Sin contratos firmados</div></div></div>`}
      </div>`).join('')

function renderClienteDetail(nombre){
  const contratos = state.contratos.filter(c=>c.cliente===nombre);
  if(contratos.length===0){ state.view='clientes'; return renderClientes(); }
  const firmados = contratos.filter(c=>c.estado==='firmado');
  const agg = firmados.map(c=>totals(c));
  const totalPlantas = agg.reduce((s,t)=>s+t.totalPlantas,0);
  const valorTotal = agg.reduce((s,t)=>s+t.valorTotal,0);
  const cobrado = agg.reduce((s,t)=>s+t.cobrado,0);
  const entregado = agg.reduce((s,t)=>s+t.entregado,0);
  const pctCobrado = valorTotal>0 ? Math.round(cobrado/valorTotal*100) : 0;
  const pctEntregado = totalPlantas>0 ? Math.round(entregado/totalPlantas*100) : 0;

  let eventos = [];
  firmados.forEach(c=>{
    (c.cobros||[]).forEach(x=> eventos.push({fecha:x.fecha, tipo:'cobro', subtipo:x.tipo, concepto:x.concepto, monto:x.monto, registrado:sumRegistrosMonto(x), efectivo:x.monto, pagado:isPagado(x)}));
    (c.entregas||[]).forEach(x=> eventos.push({fecha:x.fecha, contratoId:c.id, xId:x.id, tipo:'entrega', subtipo:'entrega', concepto:`${x.variedad} — entrega ${x.anio}`, cantidad:x.cantidad, anio:x.anio, cerrado:!!x.cerrado, registrado:sumRegistrosCantidad(x), efectivo:x._efectivo, diff:x._diff, pagado:isEntregadoFull(x)}));
  });
  eventos.sort((a,b)=>a.fecha.localeCompare(b.fecha));

  return `
    <div class="detail-back" id="back-btn-clientes">← Volver a Clientes</div>
    <div class="detail-head">
      <div><h1>${nombre}</h1><div class="sub">${contratos.length} contrato${contratos.length!==1?'s':''} · ${firmados.length} firmado${firmados.length!==1?'s':''}</div></div>

/* ---------- Balance: demanda vs. provisión, con alarma y filtro ---------- */
function computeBalance(){
  const firmados = state.contratos.filter(c=>c.estado==='firmado');
  const comprometido = {};
  firmados.forEach(c=>{ (c.items||[]).forEach(i=>{ const k=i.variedad+'|'+i.anio; comprometido[k]=(comprometido[k]||0)+Number(i.cantidad||0); }); });
  const demandaInterna = {};
  state.demandaPropia.forEach(d=>{ (d.items||[]).forEach(i=>{ const k=i.variedad+'|'+i.anio; demandaInterna[k]=(demandaInterna[k]||0)+Number(i.cantidad||0); }); });
  const provisionPropia = {};
  const provisionTerceros = {};
  state.provisiones.forEach(pr=>{
    const prov = getProveedor(pr.proveedorId);
    const target = (prov && prov.tipo==='propia') ? provisionPropia : provisionTerceros;
    (pr.items||[]).forEach(i=>{ const k=i.variedad+'|'+i.anioEntrega; target[k]=(target[k]||0)+Number(i.cantidad||0); });
  });

  const demandaMap = mergeMaps(comprometido, demandaInterna);
  const provisionMap = mergeMaps(provisionPropia, provisionTerceros);
  const allKeys = new Set([...Object.keys(demandaMap), ...Object.keys(provisionMap)]);

  if(allKeys.size===0){
    return {hayDatos:false};
  }

  const variedades = [...new Set([...allKeys].map(k=>k.split('|')[0]))].sort();
  const years = [...new Set([...allKeys].map(k=>Number(k.split('|')[1])))].sort((a,b)=>a-b);

  const resumenVariedad = variedades.map(v=>{
    let dem=0, prov=0;
    years.forEach(y=>{ const k=v+'|'+y; dem += demandaMap[k]||0; prov += provisionMap[k]||0; });
    return {variedad:v, demanda:dem, provision:prov, diferencia: prov-dem};
  }).sort((a,b)=>a.diferencia-b.diferencia);

  const deficits = resumenVariedad.filter(r=>r.diferencia<0);
  const totalDemanda = resumenVariedad.reduce((s,r)=>s+r.demanda,0);
  const totalProvision = resumenVariedad.reduce((s,r)=>s+r.provision,0);
  const totalDiferencia = totalProvision - totalDemanda;

  return {hayDatos:true, comprometido, demandaInterna, provisionPropia, provisionTerceros, demandaMap, provisionMap, variedades, years, resumenVariedad, deficits, totalDemanda, totalProvision, totalDiferencia};
}

function mergeMaps(a,b){
  const out = {...a};
  Object.entries(b).forEach(([k,v])=>{ out[k] = (out[k]||0)+v; });
  return out;
}
function renderBalanceRow(label, variedad, years, map, subtotalClass, spacerBefore){
  let total = 0;
  const cells = years.map(y=>{
    const v = map[variedad+'|'+y] || 0;
    total += v;
    return `<td${subtotalClass?' style="font-weight:700"':''}>${v>0?fmtNum(v):'—'}</td>`;
  });
  const rowClass = subtotalClass ? ` class="balance-subtotal ${subtotalClass}"` : (spacerBefore ? ` class="balance-group-start"` : '');
  return `<tr${rowClass}><td${subtotalClass?' style="font-weight:700"':''}>${label}</td>${cells.join('')}<td style="font-weight:700">${total>0?fmtNum(total):'—'}</td></tr>`;
}
function renderBalanceDiferenciaRow(variedad, years, provisionMap, demandaMap){
  let total = 0;
  const cells = years.map(y=>{
    const k = variedad+'|'+y;
    const dif = (provisionMap[k]||0) - (demandaMap[k]||0);
    total += dif;
    const color = dif<0 ? 'var(--red)' : (dif>0 ? 'var(--green)' : 'var(--text-faint)');
    return `<td style="font-weight:700; color:${color}">${dif===0?'—':(dif>0?'+':'')+fmtNum(dif)}</td>`;
  });
  const colorTot = total<0 ? 'var(--red)' : (total>0 ? 'var(--green)' : 'var(--text-faint)');
  return `<tr class="pv-total balance-diferencia"><td>DIFERENCIA</td>${cells.join('')}<td style="color:${colorTot}">${total===0?'—':(total>0?'+':'')+fmtNum(total)}</td></tr>`;
}

/* ---------- text/blocks helpers for contract ---------- */
function wrapText(text, width){
  const words = text.split(/\s+/);
  let lines=[]; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>width){ lines.push(cur.trim()); cur=w; }
    else cur = (cur? cur+' ':'')+w;
  });
  if(cur) lines.push(cur.trim());
  return lines.join('\n');
}
function labelFecha(fechaISO, fechaFirma){
  if(fechaISO===fechaFirma) return 'Firma del presente contrato';
  const [y,m] = fechaISO.split('-');
  return `1 de ${MESES_NOMBRE[Number(m)]} de ${y}`;
}
function padRight(s,w){ s=String(s); return s.length>=w ? s.slice(0,w-1)+' ' : s+' '.repeat(w-s.length); }
function padLeft(s,w){ s=String(s); return s.length>=w ? s.slice(0,w) : ' '.repeat(w-s.length)+s; }
function buildTable(headers, rows){
  const widths = headers.map((h,i)=>{ let w = String(h).length; rows.forEach(r=>{ w = Math.max(w, String(r[i]).length); }); return w+3; });
  const line = cells => cells.map((c,i)=> i===0 ? padRight(String(c), widths[i]) : padLeft(String(c), widths[i])).join('');
  let out = line(headers) + '\n';
  out += widths.map(w=>'-'.repeat(w-1)+' ').join('') + '\n';
  rows.forEach(r=> out += line(r) + '\n');
  return out;
}

function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function wPara(text, opts={}){
  const rPr = [];
  if(opts.bold) rPr.push('<w:b/>');
  if(opts.size) rPr.push(`<w:sz w:val="${opts.size}"/><w:szCs w:val="${opts.size}"/>`);
  if(opts.font) rPr.push(`<w:rFonts w:ascii="${opts.font}" w:hAnsi="${opts.font}" w:cs="${opts.font}"/>`);
  const pPr = [];
  if(opts.align) pPr.push(`<w:jc w:val="${opts.align}"/>`);
  pPr.push(`<w:spacing w:before="${opts.before||0}" w:after="${opts.after!=null?opts.after:160}"/>`);
  if(opts.indent) pPr.push(`<w:ind w:left="${opts.indent}"/>`);
  return `<w:p><w:pPr>${pPr.join('')}</w:pPr><w:r>${rPr.length?'<w:rPr>'+rPr.join('')+'</w:rPr>':''}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
function blocksToDocxXml(blocks){
  let body = '';

    if(b.t==='h1') body += wPara(b.s.toUpperCase(), {bold:true, size:30, align:'center', before:240, after:240});

    else if(b.t==='h3') body += wPara(b.s, {bold:true, size:22, before:140, after:100});
    else if(b.t==='p') body += wPara(b.s, {align:'both', after:160});
    else if(b.t==='li') body += wPara(b.s, {indent:400, after:60});
    else if(b.t==='table'){
      b.s.split('\n').forEach(line=>{ if(line.trim()==='') return; body += wPara(line, {font:'Courier New', size:15, after:0}); });
      body += wPara('', {after:160});

<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>`;
}

function crc32(buf){
  if(!crc32.table){
    const t = [];
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c = (c&1)? (0xEDB88320 ^ (c>>>1)) : (c>>>1); } t[n]=c>>>0; }
    crc32.table = t;
  }
  let crc = 0 ^ (-1);
  for(let i=0;i<buf.length;i++){ crc = (crc>>>8) ^ crc32.table[(crc ^ buf[i]) & 0xFF]; }
  return (crc ^ (-1)) >>> 0;
}
function makeZip(files){
  const encoder = new TextEncoder();
  let localParts = [], centralParts = [], offset = 0;
  files.forEach(f=>{
    const nameBytes = encoder.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    localParts.push(local, data);
    const central = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true); cdv.setUint16(10, 0, true); cdv.setUint16(12, 0, true); cdv.setUint16(14, 0, true);
    cdv.setUint32(16, crc, true); cdv.setUint32(20, size, true); cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true); cdv.setUint16(30, 0, true); cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true); cdv.setUint16(36, 0, true); cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);
    offset += local.length + data.length;
  });
  const centralSize = centralParts.reduce((s,p)=>s+p.length,0);
  const centralOffset = offset;
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true); edv.setUint16(4,0,true); edv.setUint16(6,0,true);
  edv.setUint16(8, files.length, true); edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true); edv.setUint32(16, centralOffset, true); edv.setUint16(20, 0, true);
  const allParts = [...localParts, ...centralParts, end];
  const totalLen = allParts.reduce((s,p)=>s+p.length,0);
  const result = new Uint8Array(totalLen);
  let pos=0;
  allParts.forEach(p=>{ result.set(p, pos); pos+=p.length; });
  return result;
}

function colLetter(n){ let s=''; while(n>0){ let m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function xlsxCell(val, r, c, styleIdx){
  const ref = colLetter(c)+r;
  const sAttr = styleIdx ? ` s="${styleIdx}"` : '';
  if(typeof val==='number' && isFinite(val)) return `<c r="${ref}"${sAttr}><v>${val}</v></c>`;
  const text = xmlEsc(val==null?'':String(val));
  return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${text}</t></is></c>`;
}
function buildSheetXml(rows){
  let out = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  rows.forEach((row, ri)=>{
    const r = ri+1;
    out += `<row r="${r}">`;
    row.forEach((val, ci)=>{ out += xlsxCell(val, r, ci+1, ri===0?1:0); });
    out += `</row>`;
  });
  out += `</sheetData></worksheet>`;
  return out;
}

  const files = [

function reportePedidosRows(){
  const rows = [['Cliente','Estado','Fecha de firma','Precio base (USD)','Regalía (USD)','Mes anticipo','Mes saldo','Mes regalía 1','Mes regalía 2','Total plantas','Valor total (USD)','Cobrado (USD)','% Cobrado','Entregado (plantas)','% Entregado','IVA generado (USD)','IVA cobrado (USD)']];
  state.contratos.forEach(c=>{
    const t = totals(c);
    const mr = resolveMeses(c);
    const pctCobrado = t.valorTotal>0 ? Math.round((t.cobrado/t.valorTotal)*100) : 0;
    const pctEntregado = t.totalPlantas>0 ? Math.round((t.entregado/t.totalPlantas)*100) : 0;
    rows.push([c.cliente||'', c.estado, c.fechaFirma||'', c.precioBase, c.regalia,
      nombreMes(mr.mesPlantas1), nombreMes(mr.mesPlantas2), nombreMes(mr.mesRegalia1), nombreMes(mr.mesRegalia2),
      t.totalPlantas, t.valorTotal, t.cobrado, pctCobrado, t.entregado, pctEntregado, t.iva, t.ivaCobrado]);
  });
  return rows;
}
function reporteCobrosRows(){
  const rows = [['Cliente','Fecha','Concepto','Tipo','Monto (USD)','IVA 21% (USD)','Total c/IVA (USD)','Registrado (USD)','Estado']];
  state.contratos.filter(c=>c.estado==='firmado').forEach(c=>{
    (c.cobros||[]).forEach(x=>{
      const registrado = sumRegistrosMonto(x);

      rows.push([c.cliente, x.fecha, x.concepto, x.tipo, x.monto, x.monto*IVA_PCT, x.monto*(1+IVA_PCT), registrado, estado]);
    });
  });

}
function reporteEntregasRows(){

  state.contratos.filter(c=>c.estado==='firmado').forEach(c=>{

function reporteDistribucionRows(modo){
  const firmados = state.contratos.filter(c=>c.estado==='firmado');
  const years = [...new Set(firmados.flatMap(c=>c.items.map(i=>Number(i.anio))))].sort((a,b)=>a-b);
  if(modo==='anio'){
    const rows = [['Año','Total plantas']];
    years.forEach(y=>{
      const total = firmados.flatMap(c=>c.items).filter(i=>Number(i.anio)===y).reduce((s,i)=>s+Number(i.cantidad||0),0);
      rows.push([y, total]);
    });
    rows.push(['TOTAL', years.reduce((s,y)=> s + firmados.flatMap(c=>c.items).filter(i=>Number(i.anio)===y).reduce((a,i)=>a+Number(i.cantidad||0),0), 0)]);
    return rows;
  }
  const map = {};
  firmados.forEach(c=>{
    c.items.forEach(it=>{
      let key, cliente=null, variedad=null;
      if(modo==='todo'){ key = c.cliente+'|||'+it.variedad; cliente=c.cliente; variedad=it.variedad; }
      else if(modo==='cliente'){ key = c.cliente; cliente=c.cliente; }
      else { key = it.variedad; variedad=it.variedad; }
      if(!map[key]) map[key] = {cliente, variedad, porAnio:{}, total:0};
      const y = Number(it.anio);
      map[key].porAnio[y] = (map[key].porAnio[y]||0) + Number(it.cantidad||0);
      map[key].total += Number(it.cantidad||0);
    });
  });
  let dataRows = Object.values(map);
  if(modo==='todo') dataRows.sort((a,b)=> a.cliente.localeCompare(b.cliente) || a.variedad.localeCompare(b.variedad));
  else if(modo==='cliente') dataRows.sort((a,b)=> a.cliente.localeCompare(b.cliente));
  else dataRows.sort((a,b)=> a.variedad.localeCompare(b.variedad));

  const header = modo==='todo' ? ['Cliente','Variedad',...years,'Total'] : modo==='cliente' ? ['Cliente',...years,'Total'] : ['Variedad',...years,'Total'];
  const rows = [header];
  dataRows.forEach(r=>{
    const labelCells = modo==='todo' ? [r.cliente, r.variedad] : modo==='cliente' ? [r.cliente] : [r.variedad];
    rows.push([...labelCells, ...years.map(y=> r.porAnio[y]||0), r.total]);
  });
  const totalYear = {}; years.forEach(y=> totalYear[y] = dataRows.reduce((s,r)=>s+(r.porAnio[y]||0),0));
  const grandTotal = dataRows.reduce((s,r)=>s+r.total,0);
  const totalLabelCells = modo==='todo' ? ['TOTAL',''] : ['TOTAL'];
  rows.push([...totalLabelCells, ...years.map(y=>totalYear[y]), grandTotal]);
  return rows;
}

function descargarReporteExcel(){
  const sheets = [
    {name:'Pedidos', rows: reportePedidosRows()},
    {name:'Cobros', rows: reporteCobrosRows()},
    {name:'Entregas', rows: reporteEntregasRows()},
    {name:'Distrib. Cliente-Variedad', rows: reporteDistribucionRows('todo')},
    {name:'Distrib. Cliente', rows: reporteDistribucionRows('cliente')},
    {name:'Distrib. Variedad', rows: reporteDistribucionRows('variedad')},
    {name:'Distrib. Año', rows: reporteDistribucionRows('anio')},
  ];
  const bytes = buildXlsxWorkbook(sheets);
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fecha = new Date().toISOString().slice(0,10);
  a.download = `Reporte_EarlyCrop_${fecha}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function descargarContratoWord(c){
  const blocks = generarContratoBlocks(c);
  const xml = blocksToDocxXml(blocks);
  const encoder = new TextEncoder();
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;
  const files = [
    {name:'[Content_Types].xml', data: encoder.encode(contentTypes)},
    {name:'_rels/.rels', data: encoder.encode(rels)},
    {name:'word/document.xml', data: encoder.encode(xml)},
  ];
  const zipBytes = makeZip(files);
  const blob = new Blob([zipBytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Contrato_${(c.cliente||'pedido').replace(/[^a-zA-Z0-9]+/g,'_')}.docx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}


/* ---------- events ---------- */
function attachAutoCap(el){
  if(!el) return;
  el.addEventListener('input', ()=>{
    if(el.value.length>0){
      const cursor = el.selectionStart;
      el.value = el.value.charAt(0).toUpperCase()+el.value.slice(1);
      try{ el.setSelectionRange(cursor,cursor); }catch(e){}
    }
  });
}
function attachThousandsFormat(el){
  if(!el) return;
  el.addEventListener('blur', ()=>{ el.value = formatThousands(parseThousands(el.value)); });
}

    const c = getContract(state.activeId);
    c.estado = 'firmado';

    persist().then(render);

  const btnDel = document.getElementById('btn-del');
  if(btnDel) btnDel.onclick = async ()=>{

      if(r && r.esCompensacion){

      ev.preventDefault();
      const [contratoId, xId] = el.dataset.reabrir.split(':');
      await reabrirLinea(contratoId, xId);
    };
  });
}

async function savePedido(){
  const c = getContract(state.activeId);
  syncFormToState(c);
  recalcContract(c);
  state.tab = 'cobros';
  render();
  persist().then(render);
}

function showConfirmModal(message, okLabel, okColor){
  okLabel = okLabel || 'Eliminar';
  okColor = okColor || 'var(--red)';
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className='overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px">
        <div class="modal-body" style="padding-top:26px; padding-bottom:6px;"><div style="font-size:14px; line-height:1.5;">${message}</div></div>
        <div class="modal-foot">
          <button class="btn" id="cm-cancel">Cancelar</button>
          <button class="btn" id="cm-ok" style="background:${okColor}; border-color:${okColor}; color:#fff;">${okLabel}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('cm-cancel').onclick = ()=>{ overlay.remove(); resolve(false); };
    document.getElementById('cm-ok').onclick = ()=>{ overlay.remove(); resolve(true); };
  });
}

async function reabrirLinea(contratoId, xId){
  if(!(await showConfirmModal('¿Reabrir esta línea? Vuelve a quedar pendiente y la compensación que generaba se recalcula sola.', 'Reabrir', 'var(--blue)'))) return;
  const c = getContract(contratoId);
  const x = (c.entregas||[]).find(y=>y.id===xId);
  if(!x) return;
  x.cerrado = false;
  render();
  persist().then(render);
}

async function borrarRegistroCascada(tipo, contratoId, xId, regId){
  const c = getContract(contratoId);
  const arr = tipo==='cobro' ? c.cobros : c.entregas;
  const x = arr.find(y=>y.id===xId);
  if(!x) return;
  const r = (x.registros||[]).find(rr=>rr.id===regId);
  if(!r) return;

  if(r.esCompensacion){
    // Legado de versiones anteriores: la compensación ya no se guarda como registro,
    // pero si quedó alguna de antes, no se puede tocar directamente.
    await showAlertModal('Este registro es una compensación de una versión anterior y no se puede eliminar directamente. Se va a limpiar sola la próxima vez que se cargue la página.', 'warn');
    return;
  }

  if(!(await showConfirmModal('¿Eliminar este registro?'))) return;

  x.registros = (x.registros||[]).filter(rr=>rr.id!==regId);

  render();
  persist().then(render);
}

function showAlertModal(message, tipo){
  const color = tipo==='error' ? 'var(--red)' : (tipo==='warn' ? 'var(--amber)' : 'var(--blue)');
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className='overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px">
        <div class="modal-body" style="padding-top:26px; padding-bottom:6px;"><div style="font-size:14px; line-height:1.5;">${message}</div></div>
        <div class="modal-foot">
          <button class="btn" id="am-ok" style="background:${color}; border-color:${color}; color:#fff;">Entendido</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('am-ok').onclick = ()=>{ overlay.remove(); resolve(); };
  });
}

function openAjustarCantidadesModal(contratoId){
  const c = getContract(contratoId);
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>Ajustar cantidades reales — ${c.cliente}</h2><button class="btn btn-ghost" id="m-close">✕</button></div>
      <div class="modal-body">
        <div class="hint" style="margin-bottom:14px">Cambiá acá la cantidad real de cada línea (por ejemplo, si vas a entregar más de una variedad y menos de otra dentro del mismo año). No podés cambiar variedad ni año desde acá — para eso hay que dar de baja el contrato y crear uno nuevo.</div>
        ${c.items.map((it,idx)=>`
          <div class="item-row" style="grid-template-columns:1fr .6fr 1fr;" data-adj-idx="${idx}">
            <div style="align-self:center; font-weight:600">${it.variedad}</div>
            <div style="align-self:center; color:var(--text-faint)">${it.anio}</div>
            <input type="text" inputmode="numeric" data-adj-cantidad value="${formatThousands(it.cantidad)}">
          </div>`).join('')}
      </div>
      <div class="modal-foot">
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary" id="m-save">Guardar ajuste</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.querySelectorAll('[data-adj-cantidad]').forEach(attachThousandsFormat);
  document.getElementById('m-close').onclick = ()=> overlay.remove();
  document.getElementById('m-cancel').onclick = ()=> overlay.remove();
  document.getElementById('m-save').onclick = async ()=>{
    const rows = [...overlay.querySelectorAll('[data-adj-idx]')];
    const nuevos = rows.map(row=> parseThousands(row.querySelector('[data-adj-cantidad]').value));
    if(nuevos.some(v=>v<0)){ await showAlertModal('Las cantidades no pueden ser negativas.', 'error'); return; }

    const years = [...new Set(c.items.map(i=>Number(i.anio)))];
    const totalAntesPorAnio = {}, totalDespuesPorAnio = {};
    years.forEach(y=>{
      totalAntesPorAnio[y] = c.items.filter(i=>Number(i.anio)===y).reduce((s,i)=>s+Number(i.cantidad||0),0);
      totalDespuesPorAnio[y] = c.items.reduce((s,i,idx)=> Number(i.anio)===y ? s+nuevos[idx] : s, 0);
    });
    const cambios = years.filter(y=> totalAntesPorAnio[y] !== totalDespuesPorAnio[y]);
    if(cambios.length>0){
      const detalle = cambios.map(y=>`Año ${y}: ${fmtNum(totalAntesPorAnio[y])} → ${fmtNum(totalDespuesPorAnio[y])} plantas`).join('\n');
      const seguro = await showConfirmModal(`El total de plantas de estos años cambia:<br><br>${detalle.replace(/\n/g,'<br>')}<br><br>Esto va a modificar el cronograma de cobros de esos años (anticipo/saldo/regalía). ¿Confirmás?`, 'Confirmar cambio', 'var(--blue)');
      if(!seguro) return;
    }

    c.items.forEach((it,idx)=>{ it.cantidad = nuevos[idx]; });
    recalcContract(c);
    overlay.remove();
    render();
    persist().then(render);
  };
}

function openProveedorModal(proveedorId){
  const editing = !!proveedorId;
  let draft = editing ? JSON.parse(JSON.stringify(getProveedor(proveedorId))) : {id: uid(), nombre:'', tipo:'tercero'};

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>${editing?'Editar proveedor':'Nuevo proveedor'}</h2><button class="btn btn-ghost" id="m-close">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Nombre</label><input id="p-nombre" value="${draft.nombre}" placeholder="Ej: Vivero Norte, Finca propia Sur..."></div>
        <div class="field"><label>Tipo</label>
          <div class="month-toggle">
            <button type="button" class="btn btn-sm ${draft.tipo==='tercero'?'active':''}" id="p-tipo-tercero">Tercero</button>
            <button type="button" class="btn btn-sm ${draft.tipo==='propia'?'active':''}" id="p-tipo-propia">Producción propia</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        ${editing?`<button class="btn btn-ghost btn-danger" id="p-delete">Eliminar proveedor</button>`:''}
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary" id="m-save">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  attachAutoCap(document.getElementById('p-nombre'));
  document.getElementById('m-close').onclick = ()=> overlay.remove();
  document.getElementById('m-cancel').onclick = ()=> overlay.remove();
  document.getElementById('p-tipo-tercero').onclick = ()=>{
    draft.tipo='tercero';
    document.getElementById('p-tipo-tercero').className='btn btn-sm active';
    document.getElementById('p-tipo-propia').className='btn btn-sm';
  };
  document.getElementById('p-tipo-propia').onclick = ()=>{
    draft.tipo='propia';
    document.getElementById('p-tipo-propia').className='btn btn-sm active';
    document.getElementById('p-tipo-tercero').className='btn btn-sm';
  };
  if(editing){
    document.getElementById('p-delete').onclick = async ()=>{
      const tieneProvisiones = state.provisiones.some(pr=>pr.proveedorId===proveedorId);
      const msg = tieneProvisiones
        ? '¿Eliminar este proveedor? Las provisiones que ya cargaste con él van a quedar sin proveedor asociado.'
        : '¿Eliminar este proveedor?';
      if(!(await showConfirmModal(msg))) return;
      state.proveedores = state.proveedores.filter(p=>p.id!==proveedorId);
      overlay.remove();
      render();
      persistProveedores().then(render);
    };
  }
  document.getElementById('m-save').onclick = async ()=>{
    draft.nombre = document.getElementById('p-nombre').value;
    if(!draft.nombre.trim()){ await showAlertModal('Ingresá un nombre.', 'error'); return; }
    const idx = state.proveedores.findIndex(p=>p.id===draft.id);
    if(idx>=0) state.proveedores[idx] = draft; else state.proveedores.push(draft);
    overlay.remove();
    render();
    persistProveedores().then(render);
  };
}

function openProvisionModal(provisionId){
  if(state.proveedores.length===0){
    showAlertModal('Todavía no cargaste ningún proveedor. Andá a "Proveedores" y creá uno primero.', 'warn');
    return;
  }
  const editing = !!provisionId;
  let draft = editing ? JSON.parse(JSON.stringify(getProvision(provisionId))) : {id: uid(), proveedorId: state.proveedores[0].id, items:[{variedad:VARIEDADES[0], cantidad:0, mesEntrega:1, anioEntrega:ANIOS[1]}]};

  const overlay = document.createElement('div');
  overlay.className='overlay';

  function syncDraft(){
    const provSel = document.getElementById('pr-proveedor');
    if(provSel) draft.proveedorId = provSel.value;
    document.querySelectorAll('[data-pritem-idx]').forEach(row=>{
      const idx = Number(row.dataset.pritemIdx);
      if(!draft.items[idx]) return;
      row.querySelectorAll('[data-pritem-field]').forEach(el=>{
        const f = el.dataset.pritemField;
        draft.items[idx][f] = f==='cantidad' ? parseThousands(el.value) : (f==='variedad' ? el.value : Number(el.value));
      });
    });
  }

  function wireBody(){
    document.querySelectorAll('[data-pritem-field="cantidad"]').forEach(attachThousandsFormat);
    document.getElementById('m-close').onclick = ()=> overlay.remove();
    document.getElementById('m-cancel').onclick = ()=> overlay.remove();
    document.getElementById('pr-add-item').onclick = ()=>{ syncDraft(); draft.items.push({variedad:VARIEDADES[0], cantidad:0, mesEntrega:1, anioEntrega:ANIOS[1]}); renderBody(); };
    document.querySelectorAll('[data-pritem-remove]').forEach(el=>{
      el.onclick = ()=>{ syncDraft(); draft.items.splice(Number(el.dataset.pritemRemove),1); renderBody(); };
    });
    if(editing){
      document.getElementById('pr-delete').onclick = async ()=>{
        if(!(await showConfirmModal('¿Eliminar esta provisión?'))) return;
        state.provisiones = state.provisiones.filter(p=>p.id!==provisionId);
        overlay.remove();
        render();
        persistProvisiones().then(render);
      };
    }
    document.getElementById('m-save').onclick = async ()=>{
      syncDraft();
      const idx = state.provisiones.findIndex(p=>p.id===draft.id);
